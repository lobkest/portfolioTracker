<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Portfolio Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.0.1/chartjs-plugin-zoom.min.js"></script>
</head>
<body>
    <div class="container" id="uploadSection">
        <h1>Portfolio Dashboard</h1>
        <p>Upload je portfoliogegevens om te starten.</p>

        <form id="uploadForm">
            <label for="naam">Naam (optioneel)</label>
            <input type="text" id="naam" name="naam" placeholder="Bijv. Mijn portfolio">

            <label for="bestand1">Transacties-export (verplicht)</label>
            <p class="hint">DeGiro: Inbox &rarr; Transacties, exporteer vanaf het begin van je beleggen (.xls)</p>
            <input type="file" id="bestand1" name="bestand1" accept=".xlsx,.xls" required>

            <!-- <label for="bestand2">Rekeningoverzicht (optioneel)</label>
            <p class="hint">DeGiro: Inbox &rarr; Rekeningoverzicht, exporteer vanaf het begin van je beleggen (.xls) — wordt binnenkort gebruikt voor dividendanalyse</p>
            <input type="file" id="bestand2" name="bestand2" accept=".xlsx,.xls"> -->

            <button type="submit">Uploaden</button>
        </form>

        <hr>

        <form id="codeForm">
            <label for="codeInput">Heb je al een code?</label>
            <input type="text" id="codeInput" placeholder="Bijv. A3F9K2">
            <button type="submit">Ophalen</button>
        </form>

        <p id="errorMsg" style="color: #9C0006;"></p>
    </div>

    <div class="container" id="dashboardSection" style="width: 900px; gap: 20px; display: none;">
        <div style="width: 160px; flex-shrink: 0;">
            <button id="terugKnop" class="menuBtn">&larr; Nieuwe upload</button>
            <hr>
            <button class="menuBtn actief" data-view="portfolio">Portfolio-home</button>
            <button class="menuBtn" data-view="rendement">Rendement</button>
            <button class="menuBtn" data-view="peraandeel">Per aandeel</button>
            <button class="menuBtn" data-view="verdeling">Verdeling</button>
            <button class="menuBtn" data-view="instellingen">Instellingen</button>
        </div>

        <div style="flex-grow: 1;">
            <p id="codeText" style="display: none;">Code: <strong id="dashCode"></strong> — bewaar deze om later terug te komen.</p>

            <select id="aandeelSelect" style="display: none; margin-bottom: 15px;"></select>
            <button id="resetZoomBtn" style="margin-bottom: 10px;">Zoom resetten</button>
            <p id="verdelingTekst" style="display: none;"></p>

            <div id="chartWrapper" style="height: 400px;">
                <canvas id="rendementChart"></canvas>
            </div>

            <div id="instellingenSectie" style="display: none;"></div>
            <p id="geenData" style="display: none;">Geen koersdata gevonden voor deze tickers.</p>
        </div>
    </div>

                                    return `${ctx.label}: €${ctx.parsed.toFixed(2)} (${pct}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function wisselView(view) {
            document.querySelectorAll(".menuBtn[data-view]").forEach(btn => {
                btn.classList.toggle("actief", btn.dataset.view === view);
            });
            document.getElementById("aandeelSelect").style.display = view === "peraandeel" ? "block" : "none";
            document.getElementById("codeText").style.display = view === "portfolio" ? "block" : "none";
            document.getElementById("resetZoomBtn").style.display = (view === "verdeling" || view === "instellingen") ? "none" : "block";
            if (view !== "verdeling") {
                document.getElementById("verdelingTekst").style.display = "none";
            }
            document.getElementById("rendementChart").style.display = view === "instellingen" ? "none" : "block";
            document.getElementById("instellingenSectie").style.display = view === "instellingen" ? "block" : "none";

            if (view === "portfolio") toonPortfolio();
            else if (view === "rendement") toonRendement();
            else if (view === "verdeling") toonVerdeling();
            else if (view === "instellingen") toonInstellingen();
            else if (view === "peraandeel") {
                const select = document.getElementById("aandeelSelect");
                toonPerAandeel(select.value);
            }
        }


        function toonDashboard(data) {
            huidigeData = data;
            document.getElementById("uploadSection").style.display = "none";
            document.getElementById("dashboardSection").style.display = "flex";
            document.getElementById("dashCode").textContent = data.code;

            if (!data.chart_data) {
                document.getElementById("geenData").style.display = "block";
                return;
            }

            const select = document.getElementById("aandeelSelect");
            select.innerHTML = "";
            data.tickers.forEach(t => {
                const option = document.createElement("option");
                option.value = t.ticker;
                option.textContent = t.naam;
                select.appendChild(option);
            });

            wisselView("portfolio");
        }

        document.querySelectorAll(".menuBtn[data-view]").forEach(btn => {
            btn.addEventListener("click", () => wisselView(btn.dataset.view));
        });

        document.getElementById("aandeelSelect").addEventListener("change", (e) => {
            toonPerAandeel(e.target.value);
        });

        document.getElementById("resetZoomBtn").addEventListener("click", () => {
            if (chart) chart.resetZoom();
        });

        document.getElementById("uploadForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            document.getElementById("errorMsg").textContent = "Bezig met verwerken...";
            const formData = new FormData(e.target);
            const res = await fetch("/upload", { method: "POST", body: formData });
            const data = await res.json();
            if (!res.ok) {
                document.getElementById("errorMsg").textContent = data.error || "Er ging iets mis.";
                return;
            }
            document.getElementById("errorMsg").textContent = "";
            toonDashboard(data);
        });

        document.getElementById("codeForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const code = document.getElementById("codeInput").value.trim();
            if (!code) return;
            const res = await fetch(`/api/portfolio/${code}`);
            const data = await res.json();
            if (!res.ok) {
                document.getElementById("errorMsg").textContent = data.error || "Code niet gevonden.";
                return;
            }
            document.getElementById("errorMsg").textContent = "";
            toonDashboard(data);
        });

        document.getElementById("terugKnop").addEventListener("click", () => {
            document.getElementById("dashboardSection").style.display = "none";
            document.getElementById("uploadSection").style.display = "block";
        });
