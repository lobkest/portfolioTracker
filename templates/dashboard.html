<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Portfolio Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
    <div class="container" style="width: 700px;">
        <h1>{{ naam or "Portfolio" }}</h1>
        <p>Code: <strong>{{ code }}</strong> — bewaar deze om later terug te komen.</p>

        {% if chart_data %}
        <canvas id="rendementChart"></canvas>
        <script>
            const data = {{ chart_data | tojson }};
            new Chart(document.getElementById('rendementChart'), {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [
                        { label: 'Waarde (€)', data: data.waarde, borderColor: '#2c7a4b', fill: false },
                        { label: 'Geïnvesteerd (€)', data: data.geinvesteerd, borderColor: '#3182bd', fill: false }
                    ]
                },
                options: { responsive: true, scales: { y: { beginAtZero: false } } }
            });
        </script>
        {% else %}
        <p>Geen koersdata gevonden voor deze tickers.</p>
        {% endif %}
    </div>
</body>
</html>
