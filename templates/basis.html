<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>{% block titel %}Portfolio Dashboard{% endblock %}</title>
    {% block zoekmachine_meta %}
    <meta name="description" content="{% block beschrijving %}Upload je DeGiro-export en zie je rendement (XIRR, TWR), de verdeling naar land en sector, ETF-overlap, dividend en een prognose.{% endblock %}">
    <meta property="og:title" content="{{ self.titel() }}">
    <meta property="og:description" content="{{ self.beschrijving() }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.url_root }}">
    <meta property="og:image" content="{{ url_for('static', filename='favicon/web-app-manifest-512x512.png', _external=True) }}">
    <link rel="canonical" href="{{ request.url_root }}">
    {% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='favicon/site.webmanifest') }}">
    <meta name="theme-color" content="#2c7a4b">
    {% block head_scripts %}{% endblock %}
</head>
<body data-code="{{ code or '' }}">
    {% block inhoud %}{% endblock %}

    <footer class="sitevoet">
        <a href="/privacy">Privacy</a>
        <span aria-hidden="true">&middot;</span>
        <span>Geen financieel advies</span>
    </footer>

    <div id="laadOverlay" class="laadOverlay" hidden>
        <div class="laadKaart">
            <div class="laadSpinner"></div>
            <div id="laadOverlayTekst" class="laadOverlayTekst"></div>
            <div id="laadVoortgang" class="laadVoortgang" role="progressbar" aria-valuemin="0" aria-valuemax="100"
                 aria-valuenow="0" hidden>
                <div id="laadVoortgangBalk" class="laadVoortgangBalk"></div>
            </div>
            <div id="laadVoortgangProcent" class="laadOverlayTekst" hidden></div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/navigatie.js') }}"></script>
    <script src="{{ url_for('static', filename='js/overdracht.js') }}"></script>
    <script src="{{ url_for('static', filename='js/infotip.js') }}"></script>
    <script src="{{ url_for('static', filename='js/gedeeld.js') }}"></script>
    <script src="{{ url_for('static', filename='js/voortgang.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
