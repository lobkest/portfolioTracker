name: Tests

on:
  push:
  workflow_dispatch:        # manual "Run workflow" button in the Actions tab

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false      # a failure on one OS does not cancel the others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependencies installeren
        run: python -m pip install -r requirements.txt

      - name: Unit tests draaien
        run: python -m unittest discover -s tests -v

  test-js:
    name: JS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Node installeren
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Geen package.json/dependencies nodig: prognose.js/menu.js/transacties.js/
      # bedrijven.js zijn dependency-vrij en gebruiken Node's ingebouwde testrunner.
      - name: JS unit tests draaien
        run: node --test tests/test_prognose.js tests/test_menu.js tests/test_transacties.js tests/test_bedrijven.js tests/test_bestandskeuze.js tests/test_diagnostiek.js