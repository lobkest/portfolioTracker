name: Tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependencies installeren
        run: python -m pip install -r requirements.txt

      - name: Unit tests draaien
        run: python -m unittest discover -s tests -v

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node installeren
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Geen package.json/dependencies nodig: prognose.js is dependency-vrij
      # en gebruikt Node's ingebouwde testrunner.
      - name: JS unit tests draaien
        run: node --test tests/test_prognose.js
